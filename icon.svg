<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="256" height="256">
  <defs>
    <linearGradient id="dpat-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <!-- Original artwork for dsh-project-autotest: a pipeline of steps ending in a passing check. -->
  <rect x="1" y="1" width="22" height="22" rx="5.5" fill="url(#dpat-surface)"/>
  <!-- The pipeline: three nodes joined left to right. -->
  <g stroke="#a7f3d0" stroke-width="1.3" stroke-linecap="round">
    <path d="M6.4 8.6h3.2"/>
    <path d="M14.4 8.6h3.2"/>
  </g>
  <circle cx="4.9" cy="8.6" r="1.5" fill="#ffffff"/>
  <circle cx="12" cy="8.6" r="1.5" fill="#ffffff"/>
  <circle cx="19.1" cy="8.6" r="1.5" fill="#ffffff"/>
  <!-- The verdict: a checkmark inside a ring, the result of a green run. -->
  <path d="M12 13.2v1.4" stroke="#a7f3d0" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="12" cy="18.2" r="3.1" fill="none" stroke="#ffffff" stroke-width="1.3"/>
  <path d="M10.5 18.2l1.1 1.1 2-2.1" fill="none" stroke="#ffffff" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
